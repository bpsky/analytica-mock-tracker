<script>
// [All original JavaScript unchanged until Settings]

/* GitHub Backup - Super Simple Jugad */
function githubSync() {
  const repo = 'bpsky/analytica-mock-tracker';
  const token = localStorage.getItem('ghToken');

  const push = async () => {
    if (!token) {
      alert("Please save your GitHub token first in the Settings → GitHub Backup section");
      return;
    }
    try {
      const data = Store.exportJSON();
      const content = btoa(unescape(encodeURIComponent(data)));
      const url = `https://api.github.com/repos/${repo}/contents/analytica-data.json`;
      
      let sha = null;
      try {
        const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        if (res.ok) sha = (await res.json()).sha;
      } catch(e) {}

      await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Backup ${new Date().toISOString()}`,
          content: content,
          sha: sha
        })
      });
      UI.toast('✅ Data saved to GitHub!', 'success');
    } catch(e) {
      UI.toast('❌ Error: ' + e.message, 'error');
    }
  };

  const pull = async () => {
    if (!token) return alert("No token saved");
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/analytica-data.json`, {
        headers: { 'Authorization': `token ${token}` }
      });
      if (!res.ok) throw new Error("No backup found");
      const file = await res.json();
      const data = JSON.parse(atob(file.content));
      Store.importData(data, 'merge');
      UI.toast('✅ Data restored from GitHub', 'success');
      setTimeout(() => location.reload(), 1000);
    } catch(e) {
      UI.toast('❌ No backup or error', 'error');
    }
  };

  // Add to Settings page
  const originalSettings = Pages.settings;
  Pages.settings = function() {
    originalSettings();
    setTimeout(() => {
      const dmCard = document.querySelector('.card:has(.i-database)');
      if (dmCard) {
        const ghCard = document.createElement('div');
        ghCard.className = 'card mb-4';
        ghCard.innerHTML = `
          <div class="card-header"><div class="card-title"><i class="i-github"></i>GitHub Backup (Simple)</div></div>
          <div class="field">
            <label>Personal Access Token</label>
            <input class="input" type="password" id="ghTokenInput" placeholder="ghp_..." value="${localStorage.getItem('ghToken')||''}">
            <div class="text-xs text-muted">Only stored in your browser</div>
          </div>
          <div class="flex gap-2">
            <button class="btn" id="saveGhToken">Save Token</button>
            <button class="btn" id="pushGh">💾 Push to GitHub</button>
            <button class="btn" id="pullGh">📥 Pull from GitHub</button>
          </div>
        `;
        dmCard.parentNode.insertBefore(ghCard, dmCard.nextSibling);

        document.getElementById('saveGhToken').onclick = () => {
          const t = document.getElementById('ghTokenInput').value.trim();
          if (t) {
            localStorage.setItem('ghToken', t);
            UI.toast('Token saved!', 'success');
          }
        };
        document.getElementById('pushGh').onclick = push;
        document.getElementById('pullGh').onclick = pull;
      }
    }, 300);
  };
}

// Initialize GitHub sync
githubSync();
</script>
