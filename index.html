            try {
              Store.importData(payload, b.dataset.mode);
              m.close();
              UI.toast('Import successful','success');
              settings();
            } catch(err) {
              UI.toast('Import failed: '+err.message, 'error');
            }
          });
        } catch(err) {
          UI.toast('Invalid JSON file','error');
        }
      };
      reader.readAsText(file);
    };
    
    document.getElementById('resetBtn').onclick = () => {
      UI.confirm({title:'Reset all data?', message:'This will delete all tests, subjects, and settings. This cannot be undone.', danger:true, okLabel:'Reset Everything', onOk:() => {
        Store.reset();
        UI.toast('All data cleared','success');
        settings();
      }});
    };

    try {
      const bytes = new Blob([localStorage.getItem('analytica.v1')||'']).size;
      document.getElementById('storageUsed').textContent = (bytes/1024).toFixed(1) + ' KB';
    } catch(e) {}

    renderSubjects();
    renderErrTags();

    // Initialize Cloud Sync UI
    CloudSync.initSettingsUI();
  }

  return { dashboard, add, testDetail, history, analytics, revision, settings };
})();

/* =========================================================
   CLOUD SYNC (GitHub Gist)
========================================================= */
const CloudSync = (() => {
  const GIST_DESC = 'Analytica Mock Tracker — Cloud Backup';
  const GIST_FILE = 'analytica-backup.json';
  const TOKEN_KEY = 'analytica.cloudToken';
  const GIST_ID_KEY = 'analytica.cloudGistId';
  const LAST_SYNC_KEY = 'analytica.cloudLastSync';
  const AUTO_SYNC_KEY = 'analytica.cloudAutoSync';

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function getGistId() { return localStorage.getItem(GIST_ID_KEY) || ''; }
  function setGistId(id) { localStorage.setItem(GIST_ID_KEY, id); }
  function getLastSync() { return localStorage.getItem(LAST_SYNC_KEY) || ''; }
  function setLastSync(ts) { localStorage.setItem(LAST_SYNC_KEY, ts); }
  function isAutoSync() { return localStorage.getItem(AUTO_SYNC_KEY) === 'true'; }
  function setAutoSync(v) { localStorage.setItem(AUTO_SYNC_KEY, v ? 'true' : 'false'); }

  function headers() {
    return {
      'Authorization': `token ${getToken()}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    };
  }

  function buildPayload() {
    return {
      metadata: {
        app: 'analytica-mock-tracker',
        version: '2.0',
        syncedAt: new Date().toISOString(),
        testCount: Store.state.tests.length,
      },
      data: JSON.parse(Store.exportJSON()),
    };
  }

  async function findExistingGist() {
    // Scan up to 10 pages of gists so an old backup isn't missed by the 100-gist first page
    for (let page = 1; page <= 10; page++) {
      const resp = await fetch(`https://api.github.com/gists?per_page=100&page=${page}`, { headers: headers() });
      if (!resp.ok) throw new Error(`Failed to list gists (${resp.status})`);
      const gists = await resp.json();
      if (!Array.isArray(gists) || gists.length === 0) break;
      const hit = gists.find(g => g.description === GIST_DESC && g.files && g.files[GIST_FILE]);
      if (hit) return hit;
    }
    return undefined;
  }

  async function push() {
    if (!getToken()) throw new Error('No GitHub token set. Add your Personal Access Token first.');

    UI.toast('Pushing data to cloud…', 'info');

    let gistId = getGistId();
    const payload = buildPayload();
    const body = {
      description: GIST_DESC,
      public: false,
      files: { [GIST_FILE]: { content: JSON.stringify(payload, null, 2) } },
    };

    try {
      if (gistId) {
        // Try to update existing gist
        const resp = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH', headers: headers(), body: JSON.stringify(body),
        });
        if (resp.status === 404) {
          // Gist was deleted remotely, clear and re-create
          gistId = '';
        } else if (!resp.ok) {
          throw new Error(`Update failed (${resp.status})`);
        } else {
          const now = new Date().toISOString();
          setLastSync(now);
          UI.toast('✅ Data pushed to cloud!', 'success');
          return { gistId, isNew: false };
        }
      }

      if (!gistId) {
        // Check if gist exists but ID not saved locally
        const existing = await findExistingGist();
        if (existing) {
          gistId = existing.id;
          setGistId(gistId);
          const resp = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH', headers: headers(), body: JSON.stringify(body),
          });
          if (!resp.ok) throw new Error(`Update failed (${resp.status})`);
          const now = new Date().toISOString();
          setLastSync(now);
          UI.toast('✅ Data pushed to cloud!', 'success');
          return { gistId, isNew: false };
        }

        // Create new gist
        const resp = await fetch('https://api.github.com/gists', {
          method: 'POST', headers: headers(), body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.message || `Create failed (${resp.status})`);
        }
        const data = await resp.json();
        setGistId(data.id);
        const now = new Date().toISOString();
        setLastSync(now);
        UI.toast('✅ Data pushed to cloud! New Gist created.', 'success');
        return { gistId: data.id, isNew: true };
      }
    } catch (e) {
      UI.toast('❌ Push failed: ' + e.message, 'error');
      throw e;
    }
  }

  async function pull() {
    if (!getToken()) throw new Error('No GitHub token set. Add your Personal Access Token first.');

    UI.toast('Pulling data from cloud…', 'info');

    try {
      let gistId = getGistId();

      if (!gistId) {
        const existing = await findExistingGist();
        if (!existing) throw new Error('No cloud backup found. Push data first.');
        gistId = existing.id;
        setGistId(gistId);
      }

      const resp = await fetch(`https://api.github.com/gists/${gistId}`, { headers: headers() });
      if (!resp.ok) {
        if (resp.status === 404) {
          setGistId('');
          throw new Error('Cloud backup not found. Push data first.');
        }
        throw new Error(`Fetch failed (${resp.status})`);
      }

      const gist = await resp.json();
      const file = gist.files[GIST_FILE];
      if (!file) throw new Error('Backup file missing from Gist.');

      const backup = JSON.parse(file.content);
      const cloudData = backup.data || backup;

      // Show merge dialog
      return new Promise((resolve) => {
        const m = UI.modal({
          title: 'Pull from Cloud',
          body: `
            <div class="text-sm mb-4">
              <p class="mb-2">Cloud backup contains <strong>${cloudData.tests?.length || 0} tests</strong></p>
              <p class="text-muted">Synced: ${backup.metadata?.syncedAt ? new Date(backup.metadata.syncedAt).toLocaleString() : 'Unknown'}</p>
              <p class="text-muted">Local: <strong>${Store.state.tests.length} tests</strong></p>
            </div>
            <p class="text-sm mb-4">How would you like to import?</p>
            <div class="flex flex-col gap-2">
              <button class="btn" data-mode="merge"><strong>Merge</strong> — add new tests, subjects & tags, keep existing</button>
              <button class="btn" data-mode="update"><strong>Update</strong> — merge + update changed tests, subjects & settings</button>
              <button class="btn btn-danger" data-mode="overwrite"><strong>Overwrite</strong> — replace all local data</button>
            </div>
          `,
          footer: `<button class="btn btn-sm" data-close>Cancel</button>`,
        });
        m.root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
          try {
            Store.importData(cloudData, b.dataset.mode);
            const now = new Date().toISOString();
            setLastSync(now);
            m.close();
            UI.toast('✅ Data pulled from cloud!', 'success');
            resolve(true);
          } catch (err) {
            UI.toast('❌ Import failed: ' + err.message, 'error');
            resolve(false);
          }
        });
      });
    } catch (e) {
      UI.toast('❌ Pull failed: ' + e.message, 'error');
      throw e;
    }
  }

  async function autoPushIfEnabled() {
    if (!isAutoSync() || !getToken()) return;
    try {
      await push();
    } catch (e) {
      console.warn('Auto-sync failed:', e);
    }
  }

  function initSettingsUI() {
    const tokenInput = document.getElementById('cloudTokenInput');
    const saveBtn = document.getElementById('cloudSaveTokenBtn');
    const pushBtn = document.getElementById('cloudPushBtn');
    const pullBtn = document.getElementById('cloudPullBtn');
    const autoSyncCb = document.getElementById('cloudAutoSync');

    if (!tokenInput) return;

    // Restore saved state
    tokenInput.value = getToken();
    autoSyncCb.checked = isAutoSync();

    const refreshStatus = () => {
      const statusEl = document.getElementById('cloudStatus');
      const statusText = document.getElementById('cloudStatusText');
      const lastSyncEl = document.getElementById('cloudLastSync');
      const lastSyncTime = document.getElementById('cloudLastSyncTime');
      const gistInfo = document.getElementById('cloudGistInfo');
      const gistIdEl = document.getElementById('cloudGistId');
      const gistLink = document.getElementById('cloudGistLink');

      if (getToken()) {
        statusEl.style.display = 'block';
        statusText.textContent = 'Token configured';
      } else {
        statusEl.style.display = 'none';
      }

      const ls = getLastSync();
      if (ls) {
        lastSyncEl.style.display = 'block';
        lastSyncTime.textContent = new Date(ls).toLocaleString();
      } else {
        lastSyncEl.style.display = 'none';
      }

      const gid = getGistId();
      if (gid) {
        gistInfo.style.display = 'block';
        gistIdEl.textContent = gid;
        gistLink.href = `https://gist.github.com/${gid}`;
      } else {
        gistInfo.style.display = 'none';
      }
    };

    saveBtn.onclick = () => {
      const val = tokenInput.value.trim();
      setToken(val);
      if (val) {
        UI.toast('✅ Token saved', 'success');
        // Verify token works
        fetch('https://api.github.com/user', { headers: headers() })
          .then(r => {
            if (r.ok) return r.json();
            throw new Error('Invalid token');
          })
          .then(user => {
            UI.toast(`Connected as ${user.login}`, 'success');
            // Try to find existing gist
            return findExistingGist();
          })
          .then(gist => {
            if (gist) {
              setGistId(gist.id);
              UI.toast('Found existing cloud backup', 'info');
            }
            refreshStatus();
          })
          .catch(e => {
            UI.toast('⚠️ Token may be invalid: ' + e.message, 'error');
            refreshStatus();
          });
      } else {
        UI.toast('Token cleared', 'info');
      }
      refreshStatus();
    };

    pushBtn.onclick = async () => {
      pushBtn.disabled = true;
      pushBtn.innerHTML = '<i data-lucide="loader"></i> Pushing…';
      UI.renderIcons();
      try {
        await push();
        refreshStatus();
      } finally {
        pushBtn.disabled = false;
        pushBtn.innerHTML = '<i data-lucide="cloud-upload"></i>Push to Cloud';
        UI.renderIcons();
      }
    };

    pullBtn.onclick = async () => {
      pullBtn.disabled = true;
      pullBtn.innerHTML = '<i data-lucide="loader"></i> Pulling…';
      UI.renderIcons();
      try {
        const ok = await pull();
        if (ok) {
          refreshStatus();
          // Re-render settings page to reflect new data
          setTimeout(() => Pages.settings(), 500);
        }
      } finally {
        pullBtn.disabled = false;
        pullBtn.innerHTML = '<i data-lucide="cloud-download"></i>Pull from Cloud';
        UI.renderIcons();
      }
    };

    autoSyncCb.onchange = () => {
      setAutoSync(autoSyncCb.checked);
      UI.toast(autoSyncCb.checked ? 'Auto-sync enabled' : 'Auto-sync disabled', 'info');
    };

    refreshStatus();
  }

  return { push, pull, autoPushIfEnabled, initSettingsUI, isAutoSync };
})();

/* =========================================================
   APP
========================================================= */
const App = (() => {
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    Store.updateSettings({theme});
    localStorage.setItem('analytica.theme', theme);
    const btn = document.getElementById('themeToggle');
    btn.innerHTML = theme !== 'light' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
    UI.renderIcons();
    
    const meta = document.getElementById('themeColorMeta');
    if(meta) meta.content = theme === 'dark' ? '#0a0a0b' : theme === 'amoled' ? '#000000' : '#ffffff';
  }

  function initTheme() {
    const saved = localStorage.getItem('analytica.theme') || Store.state.settings.theme || 'light';
    setTheme(saved);
  }

  function nav(page, params={}) {
    Charts.destroyAll();
    document.querySelectorAll('.nav-item, .bottomnav button').forEach(b => {
      b.classList.toggle('active', b.dataset.nav === page);
    });
    
    if (page === 'dashboard') Pages.dashboard();
    else if (page === 'add') Pages.add(params.editId);
    else if (page === 'testDetail') Pages.testDetail(params.id);
    else if (page === 'history') Pages.history();
    else if (page === 'analytics') Pages.analytics();
    else if (page === 'revision') Pages.revision();
    else if (page === 'settings') Pages.settings();
    
    window.scrollTo({top:0, behavior: 'smooth'});
  }

  function seedDemoData() {
    if (Store.state.tests.length > 0) return;
    const subjects = Store.state.subjects;
    const errorPool = ['Conceptual','Calculation','Silly Mistake','Time Pressure','Misread Question'];
    const today = new Date();
    for (let i = 0; i < 18; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i*3 - Math.floor(Math.random()*2));
      const s = subjects[Math.floor(Math.random()*subjects.length)];
      const total = s.defaultQuestions;
      const attempted = Math.max(15, total - Math.floor(Math.random()*6));
      const wrong = Math.floor(Math.random()*Math.min(7, attempted-5));
      const correct = attempted - wrong;
      const marks = correct*s.marksPerQ - wrong*s.negative;
      const accuracy = (correct/attempted)*100;
      const attemptPct = (attempted/total)*100;
      const topics = s.topics.slice(0, 3+Math.floor(Math.random()*3));
      Store.addTest({
        subject: s.id,
        date: d.toISOString().split('T')[0],
        name: `${s.name} Sectional #${i+1}`,
        difficulty: ['Easy','Moderate','Hard'][Math.floor(Math.random()*3)],
        source: ['Testbook','Oliveboard','PracticeBook'][Math.floor(Math.random()*3)],
        totalQuestions: total,
        timeLimit: s.timeLimit,
        attempted, wrong, correct,
        marks: +marks.toFixed(2),
        accuracy: +accuracy.toFixed(1),
        attemptPct: +attemptPct.toFixed(1),
        negativeMarks: +(wrong*s.negative).toFixed(2),
        timePerQ: +((s.timeLimit*60)/attempted).toFixed(1),
        timePerCorrect: +((s.timeLimit*60)/correct).toFixed(1),
        skipped: total - attempted,
        errorTypes: errorPool.slice(0, 1+Math.floor(Math.random()*2)),
        topics,
        notes: 'Review needed on tricky questions.',
        revisionNotes: '',
      });
    }
    UI.toast('Demo data loaded','info');
  }

  function init() {
    initTheme();
    UI.applyTextSize();

    document.querySelectorAll('[data-nav]').forEach(b => {
      b.onclick = () => nav(b.dataset.nav);
    });

    document.getElementById('themeToggle').onclick = () => {
      setTheme(document.documentElement.dataset.theme === 'amoled' ? 'light' : 'amoled');
    };

    document.getElementById('fab').onclick = () => nav('add');

    document.addEventListener('keydown', e => {
      if (e.key === 'n' && !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) nav('add');
    });

    if (Store.state.tests.length === 0) {
      setTimeout(() => {
        UI.modal({
          title: 'Welcome to Analytica',
          body: `
            <p class="mb-4 text-sm">Would you like to load demo data to explore the app? You can always reset later from Settings.</p>
            <div class="flex gap-2">
              <button class="btn btn-sm" data-close>Start Empty</button>
              <button class="btn btn-sm btn-primary" id="seedYes">Load Demo Data</button>
            </div>
          `,
          footer: '',
        }).root.querySelector('#seedYes').onclick = () => {
          document.getElementById('modalOverlay').classList.remove('open');
          seedDemoData();
          nav('dashboard');
        };
      }, 300);
    }

    nav('dashboard');
  }

  return { init, nav, setTheme };
})();

window.Pages = Pages;
window.App = App;
document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
